name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node 22 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate macOS release structure
        run: npm run macos:validate

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Run fixed-output V1 regression
        run: npm run test:regression

      - name: Build production artifacts
        run: npm run build

  e2e:
    name: Chromium and WebKit acceptance
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CI: "1"
      SYMTYPE_E2E_SNAPSHOT_SUFFIX: macos-15-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium webkit

      - name: Generate macOS 15 arm64 WebKit calibration baseline
        run: >-
          npx playwright test tests/e2e/onboarding-training.spec.ts
          --project=webkit
          --grep 'only selected calibration categories'
          --update-snapshots

      - name: Upload macOS 15 arm64 WebKit calibration baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-15-webkit-calibration-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: tests/e2e/**/*macos-15-arm64.png

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            playwright-report
            test-results
